# Staging and production runtime on a single VPS (one copy per server).
# PostgreSQL and Redis are managed services and are not defined here.
#
# Used only through deploy.sh, which sets RINQUO_IMAGE to an immutable
# image reference (registry/name@sha256:...). Application configuration is
# read from the server-only env file (app.env, never committed).
# Requires Docker Compose >= 2.30 (env_file "format: raw").
name: rinquo

x-app: &app
    image: ${RINQUO_IMAGE:?set RINQUO_IMAGE (deploy.sh does this)}
    env_file:
        - path: ${RINQUO_APP_ENV_FILE:-./app.env}
          format: raw
    restart: unless-stopped
    logging:
        driver: json-file
        options:
            max-size: '20m'
            max-file: '5'

services:
    web:
        <<: *app
        ports:
            - '${RINQUO_HTTP_PORT:-80}:80'
            - '${RINQUO_HTTPS_PORT:-443}:443'
            - '${RINQUO_HTTPS_PORT:-443}:443/udp'
        volumes:
            # Certificates and Caddy state survive redeploys, so a release
            # never re-issues certificates (and never hits ACME rate limits).
            - caddy-data:/data
            - caddy-config:/config
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:2019/metrics']
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s

    horizon:
        <<: *app
        command: ['php', 'artisan', 'horizon']
        # Longer than the longest job timeout, so workers finish current jobs.
        stop_grace_period: 70s
        healthcheck:
            test: ['CMD', 'php', 'artisan', 'horizon:status']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']

    reverb:
        <<: *app
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/up']
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s

volumes:
    caddy-data:
    caddy-config:
