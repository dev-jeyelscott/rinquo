# CI override (used by the CI e2e job): the app serves the
# prebuilt assets in public/build (run `npm run build` first), so the Vite
# dev server is not started.
#
# The app also runs with APP_ENV=testing so the browser tests can read the
# Owner sign-in code (a route that exists only in the "testing" environment),
# and with the in-memory "array" mailer so no real mail is sent. Use it locally
# with: COMPOSE_FILE=compose.yaml:compose.ci.yaml docker compose up -d --wait
services:
    app:
        environment:
            APP_ENV: testing
            MAIL_MAILER: array
            # All browser tests share one IP; keep the per-IP throttles out of the way.
            RINQUO_OTP_REQUESTS_PER_IP_PER_HOUR: '1000'
            RINQUO_OTP_VERIFY_PER_IP: '1000'
    vite:
        profiles: ['vite-dev-server']
